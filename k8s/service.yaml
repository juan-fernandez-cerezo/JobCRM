apiVersion: v1
kind: Service
metadata:
  name: jobtracker-pro-service
  labels:
    app: jobtracker-pro
spec:
  # LoadBalancer automatically provisions a public Elastic Load Balancer (ELB) in AWS EKS
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: jobtracker-pro
