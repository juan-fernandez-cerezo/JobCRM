apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobtracker-pro-deployment
  labels:
    app: jobtracker-pro
spec:
  replicas: 2 # 2 replicas for high-availability
  selector:
    matchLabels:
      app: jobtracker-pro
  template:
    metadata:
      labels:
        app: jobtracker-pro
    spec:
      containers:
      - name: jobtracker-pro
        # Replace 'your-aws-account-id' and 'your-region' with your ECR Repository details in AWS
        image: your-aws-account-id.dkr.ecr.your-region.amazonaws.com/jobtracker-pro:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        
        # Premium Best Practices: Define Resource Limits & Requests
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
            
        # Liveness Probes: Verify Nginx container hasn't crashed
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
          
        # Readiness Probes: Verify application is ready to receive traffic
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
